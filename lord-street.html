<link href="https://cesium.com/downloads/cesiumjs/releases/1.140/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #cc00ff;
    --frame-border: #0000ff;
    --frame-inner: #fff;
    --ink: #1a1611;
    --paper: #f1ebdd;
    --accent: #cc00ff;
    --era-text: #9000c0;
    --timeline-bg: #110044;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- 9-slice image frame ---- */
  .frame {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  .frame-corner {
    position: absolute;
    display: block;
  }

  .frame-tl { top: 0; left: 0; width: 257px; height: 257px; }
  .frame-tr { top: 0; right: 0; width: 257px; height: 257px; }
  .frame-bl { bottom: 0; left: 0; width: 97px; height: 129px; }
  .frame-br { bottom: 0; right: 0; width: 97px; height: 129px; }

  .frame-edge {
    position: absolute;
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }

  .frame-top {
    top: 0;
    left: 257px;
    right: 257px;
    height: 86px;
    background-image: url('images/html/frame_top_1.png');
  }

  .frame-bottom {
    bottom: 0;
    left: 97px;
    right: 97px;
    height: 99px;
    background-image: url('images/html/frame_bottom.png');
  }

  .frame-left {
    left: 0;
    top: 257px;
    bottom: 129px;
    width: 69px;
    background-image: url('images/html/frame_left.png');
  }

  .frame-right {
    right: 0;
    top: 257px;
    bottom: 129px;
    width: 69px;
    background-image: url('images/html/frame_right.png');
  }

  /* ---- Map clipping frame ---- */
  .map-frame {
    position: absolute;
    top: 86px;
    bottom: 99px;
    left: 69px;
    right: 69px;
    overflow: hidden;
    z-index: 1;
  }

  #cesiumContainer {
    position: absolute;
    inset: 0;
    filter: sepia(1) saturate(0.4) contrast(1.1) brightness(0.9);
    transition: filter 1.2s ease;
  }

  /* Hide most Cesium chrome — keep credits only (required by Google ToS) */
  .cesium-viewer-toolbar,
  .cesium-viewer-animationContainer,
  .cesium-viewer-timelineContainer,
  .cesium-viewer-bottom { display: none !important; }
  .cesium-widget-credits {
    color: rgba(255, 255, 255, 0.7) !important;
    font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif !important;
    font-size: 10px !important;
  }

  /* ---- Header (hidden, replaced by artwork) ---- */
  .masthead { display: none; }
  .title-block { display: none; }
  .eyebrow { display: none; }
  h1 { display: none; }
  h1 em { display: none; }
  .meta { display: none; }

  /* ---- Header artwork (era-specific) ---- */
  .header-artwork {
    position: absolute;
    top: 32px;
    left: 50%;
    transform: translateX(-50%);
    height: 100px;
    width: 500px;
    z-index: 20;
    pointer-events: none;
  }

  .header-art {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .header-art.active {
    opacity: 1;
  }

  /* ---- Era year numbers on sides ---- */
  .era-year {
    position: absolute;
    z-index: 0;
    font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
    font-weight: 700;
    font-size: clamp(80px, 12vw, 180px);
    color: var(--era-text);
    pointer-events: none;
    top: 50%;
    line-height: 0.9;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: -0.08em;
  }

  .era-year-start {
    left: 0;
    transform: translateY(-50%);
  }

  .era-year-end {
    right: 0;
    transform: translateY(-50%);
  }

  /* ---- Custom hotspot pin (rendered as HTML overlay, positioned by Cesium) ---- */
  .hotspot {
    position: absolute;
    transform: translate(-50%, -100%);
    cursor: pointer;
    pointer-events: auto;
    z-index: 5;
    transition: transform 0.2s cubic-bezier(.2,.8,.2,1);
    will-change: transform;
  }

  .hotspot:hover { transform: translate(-50%, -100%) scale(1.08); }

  .hotspot-thumb {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #fff;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .hotspot:hover .hotspot-thumb {
    border-color: var(--accent);
    box-shadow: 2px 2px 8px rgba(0,0,0,0.5), 0 0 0 4px rgba(204, 0, 255, 0.4);
  }

  .hotspot-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .hotspot-stem {
    width: 1px;
    height: 16px;
    background: #000;
    margin: 0 auto;
  }

  /* No-photo dot marker */
  .hotspot.no-photo .hotspot-thumb {
    width: 24px;
    height: 24px;
    border: 2px solid #fff;
    background: #666;
  }
  .hotspot.no-photo .hotspot-thumb img { display: none; }
  .hotspot.no-photo .hotspot-stem { height: 8px; }
  .hotspot.no-photo .hotspot-pulse { display: none; }

  /* Pulsing ring to draw the eye */
  .hotspot-pulse {
    position: absolute;
    top: 0; left: 50%;
    transform: translate(-50%, 0);
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    opacity: 0;
    animation: pulse 2.4s ease-out infinite;
    pointer-events: none;
  }

  @keyframes pulse {
    0% { transform: translate(-50%, 0) scale(0.8); opacity: 0.7; }
    100% { transform: translate(-50%, 0) scale(2.2); opacity: 0; }
  }

  /* ---- Footer bar (removed, replaced by frame) ---- */
  .footer-bar { display: none; }

  /* ---- Era selector (pill timeline) ---- */
  .era-selector {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    gap: 32px;
    background: var(--timeline-bg);
    border: 4px solid var(--frame-border);
    border-radius: 100px;
    padding: 12px 24px;
    box-shadow: none;
  }

  .era-btn {
    padding: 10px 18px;
    background: transparent;
    border: none;
    border-radius: 100px;
    font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.3em;
    cursor: pointer;
    color: #fff;
    transition: background 0.3s, color 0.3s;
  }

  .era-btn:hover { background: rgba(255, 255, 255, 0.1); }

  .era-btn.active {
    background: var(--accent);
    color: #fff;
  }

  /* ---- Photo lightbox (covers map frame) ---- */
  .photo-viewer {
    position: absolute;
    inset: 0;
    z-index: 15;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 0;
    padding: 180px 64px 40px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }

  .photo-viewer.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* Hide markers and timeline when overlay is open */
  body.viewer-active .hotspot {
    visibility: hidden;
    pointer-events: none;
  }

  body.viewer-active .era-selector {
    display: none;
  }

  /* Close button — sits above the frame */
  .viewer-close {
    position: absolute;
    top: 102px;
    right: 85px;
    width: 40px; height: 40px;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    border: 2px solid #fff;
    border-radius: 50%;
    cursor: pointer;
    font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
    font-size: 22px;
    line-height: 1;
    z-index: 20;
    transition: background 0.15s ease;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .viewer-close.visible {
    display: flex;
  }

  .viewer-close:hover { background: rgba(255,255,255,0.25); }

  .viewer-header {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .viewer-name {
    font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
    font-weight: 500;
    font-size: 1.5rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: #fff;
    display: block;
  }

  .viewer-date-range {
    font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.5em;
    color: #fff;
    display: block;
  }

  .photo-viewer img {
    max-width: calc(100% - 32px);
    max-height: 50vh;
    display: block;
    border: 8px solid #fff;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }

  .viewer-footer {
    text-align: center;
  }

  .viewer-date {
    font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.5em;
    color: #fff;
    display: block;
  }

  /* ---- API key prompt ---- */
  .key-prompt {
    position: absolute;
    inset: 0;
    z-index: 200;
    background: var(--ink);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .key-prompt-inner {
    max-width: 520px;
    text-align: center;
  }

  .key-prompt h2 {
    font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
    font-weight: 400;
    font-size: 36px;
    margin-bottom: 8px;
  }

  .key-prompt p {
    font-size: 15px;
    line-height: 1.6;
    color: rgba(241, 235, 221, 0.75);
    margin-bottom: 20px;
  }

  .key-prompt code {
    background: rgba(241, 235, 221, 0.08);
    padding: 2px 6px;
    font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
    font-size: 12px;
    color: #f1ebdd;
  }

  .key-prompt input {
    width: 100%;
    padding: 12px 16px;
    background: transparent;
    border: 1px solid rgba(241, 235, 221, 0.3);
    color: var(--paper);
    font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
    font-size: 13px;
    margin-bottom: 12px;
  }

    background: var(--accent);
    color: var(--paper);
    border: none;
    padding: 12px 28px;
    font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease;

    display: block;
    margin-top: 18px;
    font-size: 11px;
    color: rgba(241, 235, 221, 0.5);
    line-height: 1.5;
  }

  /* Loading spinner */
  .loader {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Jost', 'Futura', 'Century Gothic', sans-serif;
    font-style: italic;
    font-size: 22px;
    letter-spacing: 0.05em;
  }

  .loader.hidden { display: none; }

  /* Mobile */
  @media (max-width: 768px) {
    .frame-tl, .frame-tr { width: 128px; height: 128px; }
    .frame-bl, .frame-br { width: 48px; height: 64px; }
    .frame-top { left: 128px; right: 128px; height: 43px; }
    .frame-bottom { left: 48px; right: 48px; height: 50px; }
    .frame-left { top: 128px; bottom: 64px; width: 35px; }
    .frame-right { top: 128px; bottom: 64px; width: 35px; }
    .map-frame { top: 43px; bottom: 50px; left: 35px; right: 35px; }
    .viewer-close { top: auto; right: auto; bottom: 66px; left: 50%; transform: translateX(-50%); }
    .header-artwork { height: 50px; width: 260px; top: 16px; }
    .era-year { font-size: clamp(40px, 10vh, 80px); }
    .photo-viewer { padding: 90px 24px 20px; justify-content: center; gap: 12px; }
    .viewer-header { gap: 4px; }
    .era-selector { bottom: 16px; gap: 12px; padding: 8px 16px; }
    .era-btn { padding: 6px 10px; font-size: 10px; letter-spacing: 0.15em; }
    .hotspot-thumb { width: 64px; height: 64px; }
    .hotspot-pulse { width: 64px; height: 64px; }
    .hotspot.no-photo .hotspot-thumb { width: 16px; height: 16px; }
    .viewer-name { font-size: 1.1rem; letter-spacing: 0.3em; }
    .viewer-date-range { font-size: 0.8rem; letter-spacing: 0.3em; }
    .viewer-date { font-size: 0.8rem; letter-spacing: 0.3em; }
  }
</style>

// ============================================================================
// API KEY HANDLING
// ============================================================================
let viewer;
const hotspotElements = new Map();

const API_KEY = 'AIzaSyB3y3mk2apYZVTzBimsOwRPxSXMSJjYC8I';
initCesium(API_KEY);

// ============================================================================
// CESIUM INITIALISATION
// ============================================================================

async function initCesium(googleKey) {
  // Cesium Ion is not required for Google tiles, but a default token avoids warnings
  Cesium.Ion.defaultAccessToken = '';

  viewer = new Cesium.Viewer('cesiumContainer', {
    globe: false,
    baseLayerPicker: false,
    geocoder: false,
    homeButton: false,
    sceneModePicker: false,
    navigationHelpButton: false,
    fullscreenButton: false,
    infoBox: false,
    selectionIndicator: false,
    timeline: false,
    animation: false,
    skyBox: false,
    skyAtmosphere: false,
  });

  viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#1a1611');

  try {
    const tileset = await Cesium.createGooglePhotorealistic3DTileset(
      { key: googleKey },
      { showCreditsOnScreen: true }
    );
    viewer.scene.primitives.add(tileset);
  } catch (err) {
    console.error('Tileset load failed:', err);
    document.getElementById('loader').textContent = 'Could not load Google tiles — check API key. (' + (err.message || err) + ')';
    return;
  }

  // Fly to Lord Street, Southport
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(-3.0048, 53.6455, 380),
    orientation: {
      heading: Cesium.Math.toRadians(20),
      pitch: Cesium.Math.toRadians(-35),
      roll: 0
    },
    duration: 3.5,
    complete: () => {
      document.getElementById('loader').classList.add('hidden');
      buildHotspots();
    }
  });
}

// ============================================================================
// GLOBAL ERA DEFINITIONS
// ============================================================================
const GLOBAL_ERAS = [
  { label: '1800–1915', start: 1800, end: 1915 },
  { label: '1916–1929', start: 1916, end: 1929 },
  { label: '1930–1969', start: 1930, end: 1969 },
  { label: '1970–1989', start: 1970, end: 1989 }
];

let currentEraIdx = 0;

function getPhotoForEra(building, era) {
  let best = null;
  for (const t of building.timeline) {
    for (const p of t.photos) {
      if (p.year >= era.start && p.year <= era.end) {
        if (!best || p.year < best.year) best = p;
      }
    }
  }
  return best;
}

function getTimelineNameForYear(building, year) {
  for (const t of building.timeline) {
    const afterStart = !t.start || year >= t.start;
    const beforeEnd = !t.end || year <= t.end;
    if (afterStart && beforeEnd) return t.name;
  }
  return building.name;
}

// ============================================================================
// HOTSPOT OVERLAY (thumbnail pins positioned by Cesium each frame)
// ============================================================================
const buildingCartesians = new Map();
const MARKER_OFFSET = 8; // metres above sampled surface

function buildHotspots() {
  BUILDINGS.forEach((b) => {
    const el = document.createElement('div');
    el.className = 'hotspot';
    el.innerHTML = `
      <div class="hotspot-pulse"></div>
      <div class="hotspot-thumb"><img src="" alt=""></div>
      <div class="hotspot-stem"></div>
    `;
    el.addEventListener('click', () => onHotspotClick(b));
    document.body.appendChild(el);
    hotspotElements.set(b.id, el);

    buildingCartesians.set(b.id, Cesium.Cartesian3.fromDegrees(b.lon, b.lat, b.altitude + MARKER_OFFSET));
  });

  viewer.scene.postRender.addEventListener(updateHotspotPositions);
  initEraSelector();
  switchEra(0);
}

function onHotspotClick(b) {
  const era = GLOBAL_ERAS[currentEraIdx];
  const photo = getPhotoForEra(b, era);
  if (photo) {
    flyToBuilding(b, () => showPhoto(b));
  } else {
    const bestEra = findBestEraForBuilding(b);
    if (bestEra !== -1) switchEra(bestEra);
  }
}

function findBestEraForBuilding(b) {
  for (let i = 0; i < GLOBAL_ERAS.length; i++) {
    if (getPhotoForEra(b, GLOBAL_ERAS[i])) return i;
  }
  return -1;
}

// Re-sample surface heights from 3D tiles until all buildings resolve
let heightsResolved = 0;
function resampleHeights() {
  if (heightsResolved >= BUILDINGS.length) return;
  heightsResolved = 0;
  BUILDINGS.forEach((b) => {
    if (b._heightSampled) { heightsResolved++; return; }
    const carto = Cesium.Cartographic.fromDegrees(b.lon, b.lat);
    const h = viewer.scene.sampleHeight(carto);
    if (h != null) {
      b._heightSampled = true;
      buildingCartesians.set(b.id, Cesium.Cartesian3.fromDegrees(b.lon, b.lat, h + MARKER_OFFSET));
      heightsResolved++;
    }
  });
}

function updateHotspotPositions() {
  resampleHeights();

  BUILDINGS.forEach((b) => {
    const el = hotspotElements.get(b.id);
    if (!el) return;

    const cartesian = buildingCartesians.get(b.id);
    const screen = Cesium.SceneTransforms.worldToWindowCoordinates(viewer.scene, cartesian);

    if (!screen) {
      el.style.display = 'none';
      return;
    }

    const cameraPos = viewer.camera.positionWC;
    const toPin = Cesium.Cartesian3.subtract(cartesian, cameraPos, new Cesium.Cartesian3());
    const dot = Cesium.Cartesian3.dot(viewer.camera.directionWC, toPin);
    if (dot < 0) {
      el.style.display = 'none';
      return;
    }

    el.style.display = 'block';
    el.style.left = screen.x + 'px';
    el.style.top = screen.y + 'px';
  });
}

// ============================================================================
// ERA SELECTOR
// ============================================================================
function initEraSelector() {
  document.querySelectorAll('.era-btn').forEach((btn) => {
    btn.addEventListener('click', () => switchEra(parseInt(btn.dataset.era)));
  });
}

const ERA_FILTERS = [
  'sepia(1) saturate(0.4) contrast(1.1) brightness(0.9)',
  'grayscale(1) sepia(0.35) hue-rotate(185deg) saturate(0.7) contrast(1.1) brightness(0.9)',
  'saturate(0.65) contrast(1.05) brightness(0.95)',
  'none'
];

function switchEra(idx) {
  currentEraIdx = idx;
  const era = GLOBAL_ERAS[idx];

  document.getElementById('cesiumContainer').style.filter = ERA_FILTERS[idx];

  document.querySelectorAll('.era-btn').forEach((btn, i) =>
    btn.classList.toggle('active', i === idx)
  );

  document.querySelectorAll('.header-art').forEach((art) =>
    art.classList.toggle('active', parseInt(art.dataset.era) === idx)
  );

  const startYear = era.label.split('–')[0];
  const endYear = era.label.split('–')[1];
  document.getElementById('eraYearStart').textContent = startYear;
  document.getElementById('eraYearEnd').textContent = endYear;

  BUILDINGS.forEach((b) => {
    const el = hotspotElements.get(b.id);
    const photo = getPhotoForEra(b, era);

    if (photo) {
      el.classList.remove('no-photo');
      const img = el.querySelector('img');
      img.src = photo.url;
      img.alt = `${b.name}, c.${photo.year}`;
    } else {
      el.classList.add('no-photo');
    }
  });

  closeViewer();
}

// ============================================================================
// PHOTO LIGHTBOX (fullscreen overlay)
// ============================================================================
let overviewCamera = null;

function saveOverviewCamera() {
  overviewCamera = {
    position: viewer.camera.position.clone(),
    direction: viewer.camera.direction.clone(),
    up: viewer.camera.up.clone()
  };
}

function getTimelineEntryForYear(building, year) {
  for (const t of building.timeline) {
    const afterStart = !t.start || year >= t.start;
    const beforeEnd = !t.end || year <= t.end;
    if (afterStart && beforeEnd) return t;
  }
  return building.timeline[0];
}

function formatDateRange(entry) {
  const start = entry.start || '?';
  const end = entry.end || 'present';
  return `${start}–${end}`;
}

function showPhoto(b) {
  const era = GLOBAL_ERAS[currentEraIdx];
  const photo = getPhotoForEra(b, era);
  if (!photo) return;

  const entry = getTimelineEntryForYear(b, photo.year);
  const name = entry ? entry.name : b.name;
  document.getElementById('viewerImg').src = photo.url;
  document.getElementById('viewerImg').alt = `${name}, c.${photo.year}`;
  document.getElementById('viewerName').textContent = name;
  document.getElementById('viewerDateRange').textContent = entry ? formatDateRange(entry) : '';
  document.getElementById('viewerDate').textContent = `C. ${photo.year}`;
  document.getElementById('photoViewer').classList.add('open');
  document.body.classList.add('viewer-active');
  document.getElementById('viewerClose').classList.add('visible');
}

function closeViewer() {
  document.getElementById('photoViewer').classList.remove('open');
  document.body.classList.remove('viewer-active');
  document.getElementById('viewerClose').classList.remove('visible');
  if (overviewCamera) {
    viewer.camera.flyTo({
      destination: overviewCamera.position,
      orientation: {
        direction: overviewCamera.direction,
        up: overviewCamera.up
      },
      duration: 1.4
    });
  }
}

document.getElementById('viewerClose').addEventListener('click', closeViewer);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeViewer();
});

function flyToBuilding(b, onComplete) {
  const STREET_BEARING = 20;
  const OFFSET_M = 100;
  const ALT = 110;

  saveOverviewCamera();

  const camBearing = b.side === 'west' ? STREET_BEARING + 90 : STREET_BEARING - 90;
  const camBearingRad = Cesium.Math.toRadians(camBearing);

  const mPerDegreeLat = 111000;
  const mPerDegreeLon = 111000 * Math.cos(Cesium.Math.toRadians(b.lat));

  const dLat = (OFFSET_M * Math.cos(camBearingRad)) / mPerDegreeLat;
  const dLon = (OFFSET_M * Math.sin(camBearingRad)) / mPerDegreeLon;

  const heading = ((camBearing + 180) % 360 + 360) % 360;

  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(b.lon + dLon, b.lat + dLat, ALT),
    orientation: {
      heading: Cesium.Math.toRadians(heading),
      pitch: Cesium.Math.toRadians(-30),
      roll: 0
    },
    duration: 1.6,
    complete: () => { if (onComplete) onComplete(); }
  });
}
